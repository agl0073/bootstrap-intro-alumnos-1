<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ejercicio 1 · Plantilla Bootstrap</title>

  <!-- ============================================================
       EJERCICIO 1 · Plantilla inicial
       ============================================================
       PASO 2a: añade aquí la etiqueta <meta name="viewport" ...>
       PASO 2b: añade aquí el <link> al CSS de Bootstrap (CDN)
  -->
<meta name="viewport" content="width=devide-width", initial-scale="1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

  <!-- PASO 2c: escribe aquí un contenedor con un título, un párrafo y un botón -->
<div class="container mt-5">
  <h1> Hola, Bootstrap! </h1>
  <p> Este es un párrafo de ejemplo para mostrar cómo se ve el texto con Bootsrtrap. </p>
  <button type="button" class="btn btn-primary"> Botón de ejemplo </button>
</div>

  <!-- PASO 2d: añade aquí el <script> del JS de Bootstrap (bundle) -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>


  <!-- PASO 4: comenta el <link> del CSS (Ctrl + /), guarda y observa qué cambia -->
  
  <!-- PASO 5: DevTools (F12) → Network → recarga y busca los archivos de Bootstrap -->

  <!-- PASO 6: Variantes y tamaños de botón -->

  <div class="container py-5">
    <h2> Variantes de botón </h2>
    <button type="button" class="btn btn-success"> Success </button>
    <button type="button" class="btn btn-danger"> Danger </button>   
    <button type="button" class="btn btn-warning"> Warning </button>  
    <button type="button" class="btn btn-outline-dark"> Info </button>    
    <hr class="my-4">
    <h2> Tamaños de botón </h2>
    <button class="btn btn-primary btn-lg"> Grande </button>
    <button class="btn btn-primary btn-sm"> Pequeño </button>

    
  </div>
   
  <p><a href="../index.html">← Volver al índice</a></p>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>

</body>
</html>
